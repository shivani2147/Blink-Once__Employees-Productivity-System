<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Add Employee - Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/js/theme.js"></script>
    <style>
        .admin-nav-secondary {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.75rem 2.5rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .dark-theme .admin-nav-secondary {
            background: rgba(17, 24, 39, 0.4);
        }

        .admin-nav-secondary a {
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .admin-nav-secondary a:hover {
            background: rgba(79, 70, 229, 0.08);
            color: var(--accent-primary);
        }

        .admin-nav-secondary a.active {
            background: rgba(79, 70, 229, 0.12);
            color: var(--accent-primary);
        }

        .multi-select {
            position: relative;
        }

        .ms-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        .ms-dropdown {
            position: absolute;
            z-index: 50;
            background: #fff;
            border: 1px solid #ccc;
            width: 100%;
            max-height: 220px;
            overflow: auto;
            margin-top: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .ms-option {
            padding: 0.35rem 0.5rem;
            display: flex;
            align-items: center;
        }

        .ms-option input {
            margin-right: 0.5rem;
        }

        .ms-tags {
            display: inline-block;
            max-width: 85%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <nav class="navbar glass-panel">
        <div class="nav-brand">
            <span class="gradient-text"><i class="fa-solid fa-bolt"></i> Blink Once</span>
        </div>
        <div class="nav-links">
            <span class="user-greeting">Hello, <strong id="nav-user-name">Admin</strong></span>
            <button class="btn btn-outline btn-sm" onclick="toggleTheme()" title="Toggle theme"><i
                    class="fa-solid fa-moon"></i></button>
            <a href="#" onclick="logout()" class="btn btn-primary btn-sm"><i
                    class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="admin-nav-secondary">
        <a href="/admin/dashboard"><i class="fa-solid fa-chart-pie"></i> Overview</a>
        <a href="/admin/attendance"><i class="fa-solid fa-fingerprint"></i> Attendance</a>
        <a href="/admin/tasks"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="/admin/leaves"><i class="fa-solid fa-umbrella-beach"></i> Leaves</a>
        <a href="/admin/performance"><i class="fa-solid fa-award"></i> Performance</a>
        <a href="/admin/view-employees"><i class="fa-solid fa-users"></i> Employees</a>
        <a href="/admin/add-employee" class="active"><i class="fa-solid fa-user-plus"></i> Add Employee</a>
        <a href="/admin/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="/admin/holidays"><i class="fa-solid fa-star"></i> Holidays</a>
    </div>
    <main class="main-container">
        <div class="glass-panel" style="padding:1.5rem; max-width:1000px; margin:1.5rem auto;">
            <h2 class="mb-3">Add New Employee</h2>
            <form id="add-employee-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="required">Employee Type</label>
                    <select name="role" class="form-control" required>
                        <option value="Editor">Editor</option>
                        <option value="Photographer">Photographer</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Intern">Intern</option>
                        <option value="Manager / Team Lead">Manager / Team Lead</option>
                    </select>
                </div>

                <h4 class="mt-4">Personal Details</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="required">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="required">Mobile Number</label>
                        <input type="text" name="mobile_number" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Date of Birth</label>
                        <input type="date" name="dob" class="form-control" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="required">Gender</label>
                        <select name="gender" class="form-control" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact Number</label>
                        <input type="text" name="emergency_contact" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="required">Address</label>
                    <textarea name="address" class="form-control" rows="2" required></textarea>
                </div>

                <div class="form-group">
                    <label>Passport Size Photo</label>
                    <input type="file" name="photo" accept="image/*" class="form-control">
                    <div id="photo-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                </div>

                <h4 class="mt-4">Education Details</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Highest Qualification</label>
                        <select name="highest_qualification" class="form-control">
                            <option value="High School">High School</option>
                            <option value="Diploma">Diploma</option>
                            <option value="Bachelor's">Bachelor's</option>
                            <option value="Master's">Master's</option>
                            <option value="PhD">PhD</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>School / College / Institution</label>
                        <input type="text" name="institution_name" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload Marksheet / Degree Certificate</label>
                    <input type="file" name="certificates" class="form-control">
                    <div id="certificates-edu-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                </div>

                <h4 class="mt-4">Employment Details</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Date of Joining</label>
                        <input type="date" name="date_of_joining" class="form-control">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Designation</label>

                        <div class="multi-select" id="designation_multi"></div>
                        <select name="designation" id="designation_select" class="form-control" multiple size="5"
                            style="display:none;">
                            <option value="Photographer">Photographer</option>
                            <option value="Videographer">Videographer</option>
                            <option value="Cinematographer">Cinematographer</option>
                            <option value="Video Editor">Video Editor</option>
                            <option value="Photo Editor">Photo Editor</option>
                            <option value="VFX Editor">VFX Editor</option>
                            <option value="Social Media Manager">Social Media Manager</option>
                            <option value="Sales Executive">Sales Executive</option>
                            <option value="Marketing Executive">Marketing Executive</option>
                            <option value="Client Relationship Manager">Client Relationship Manager</option>
                            <option value="Team Lead">Team Lead</option>
                            <option value="Project Manager">Project Manager</option>
                            <option value="Department Manager">Department Manager</option>
                            <option value="Freelance Photographer / Videographer">Freelance Photographer / Videographer
                            </option>
                            <option value="Freelance Editor">Freelance Editor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary / Payment Type</label>
                        <select name="salary_type" class="form-control">
                            <option value="Monthly Salary">Monthly Salary</option>
                            <option value="Per Project">Per Project</option>
                            <option value="Freelance Rate">Freelance Rate</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Salary Amount (Numeric)</label>
                    <input type="number" step="0.01" name="salary_amount" class="form-control" placeholder="e.g. 50000">
                </div>

                <h4 class="mt-4">Skills & Experience</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Experience (Years/Months)</label>
                        <input type="text" name="experience" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Camera Skill Level</label>
                        <input type="text" name="camera_skill_level" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Skills / Expertise</label>
                    <textarea name="skills" class="form-control" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Software Knowledge</label>
                    <input type="text" name="software_knowledge" class="form-control">
                </div>

                <h4 class="mt-4">Documents Upload</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Resume / CV</label>
                        <input type="file" name="resume" class="form-control">
                        <div id="resume-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                    </div>
                    <div class="form-group">
                        <label>Aadhaar Front</label>
                        <input type="file" name="aadhaar_front" class="form-control">
                        <div id="aadhaar_front-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Aadhaar Back</label>
                        <input type="file" name="aadhaar_back" class="form-control">
                        <div id="aadhaar_back-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                    </div>
                    <div class="form-group">
                        <label>Certificates</label>
                        <input type="file" name="certificates" class="form-control">
                        <div id="certificates-name" class="file-name-display" style="margin-top:0.5rem; font-size:0.85rem; color:#666;"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Create Employee</button>
                    <a href="/admin/dashboard" class="btn btn-outline" style="margin-left:0.5rem;">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Create a dropdown-style multi-select (checkbox list) wired to an underlying <select>
        function createMultiSelect(selectId, containerId, searchInputId, placeholder) {
            const select = document.getElementById(selectId);
            const container = document.getElementById(containerId);
            const searchInput = document.getElementById(searchInputId);
            if (!select || !container) return;

            const btn = document.createElement('div'); btn.className = 'ms-button';
            const tags = document.createElement('span'); tags.className = 'ms-tags'; tags.textContent = placeholder;
            const caret = document.createElement('span'); caret.textContent = '▾';
            btn.appendChild(tags); btn.appendChild(caret);

            const dropdown = document.createElement('div'); dropdown.className = 'ms-dropdown'; dropdown.style.display = 'none';

            Array.from(select.options).forEach((opt, idx) => {
                const row = document.createElement('label'); row.className = 'ms-option';
                const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = opt.value; cb.checked = opt.selected;
                cb.dataset.idx = idx;
                const txt = document.createElement('span'); txt.textContent = opt.text;
                row.appendChild(cb); row.appendChild(txt);
                dropdown.appendChild(row);

                cb.addEventListener('change', () => {
                    select.options[cb.dataset.idx].selected = cb.checked;
                    updateTags();
                });
            });

            function updateTags() {
                const selected = Array.from(select.selectedOptions).map(o => o.text);
                tags.textContent = selected.length ? selected.join(', ') : placeholder;
            }

            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    const q = searchInput.value.trim().toLowerCase();
                    Array.from(dropdown.children).forEach(row => {
                        const text = row.textContent.trim().toLowerCase();
                        row.style.display = q === '' || text.includes(q) ? '' : 'none';
                    });
                });
            }

            btn.addEventListener('click', (ev) => { ev.stopPropagation(); dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none'; });
            document.addEventListener('click', (e) => { if (!container.contains(e.target)) dropdown.style.display = 'none'; });

            container.appendChild(btn);
            container.appendChild(dropdown);
            updateTags();
        }

        createMultiSelect('designation_select', 'designation_multi', 'desig_search', 'Select designations');

        let editEmployeeId = null;

        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function setEditMode(id) {
            editEmployeeId = id;
            const title = document.querySelector('main h2');
            const submitButton = document.querySelector('button[type="submit"]');
            if (title) title.textContent = 'Edit Employee';
            if (submitButton) submitButton.textContent = 'Update Employee';
        }

        function setMultiSelectValues(selectId, values) {
            const select = document.getElementById(selectId);
            if (!select) return;
            const selectedValues = Array.isArray(values)
                ? values
                : (values || '').split(',').map(v => v.trim()).filter(Boolean);
            Array.from(select.options).forEach(option => {
                option.selected = selectedValues.includes(option.value);
            });
        }

        async function loadEmployeeForEdit(id) {
            if (!id) return;
            const res = await fetch('/api/admin/employees?employee_id=' + encodeURIComponent(id));
            if (!res.ok) return;
            const data = await res.json();
            const emp = (data.employees || [])[0];
            if (!emp) return;

            setEditMode(id);
            document.querySelector('input[name="full_name"]').value = emp.employee_name || '';
            document.querySelector('input[name="email"]').value = emp.email || '';
            document.querySelector('input[name="mobile_number"]').value = emp.mobile_number || '';
            document.querySelector('input[name="dob"]').value = emp.dob || '';
            document.querySelector('select[name="gender"]').value = emp.gender || '';
            document.querySelector('input[name="emergency_contact"]').value = emp.emergency_contact || '';
            document.querySelector('textarea[name="address"]').value = emp.address || '';
            document.querySelector('select[name="role"]').value = emp.role || 'Editor';
            document.querySelector('input[name="date_of_joining"]').value = emp.date_of_joining || '';
            document.querySelector('input[name="salary_amount"]').value = emp.salary_amount || '';
            document.querySelector('input[name="experience"]').value = emp.experience || '';
            document.querySelector('input[name="camera_skill_level"]').value = emp.camera_skill_level || '';
            document.querySelector('textarea[name="skills"]').value = emp.skills || '';
            document.querySelector('input[name="software_knowledge"]').value = emp.software_knowledge || '';
            document.querySelector('select[name="highest_qualification"]').value = emp.highest_qualification || '';
            document.querySelector('input[name="institution_name"]').value = emp.institution_name || '';
            document.querySelector('select[name="salary_type"]').value = emp.salary_type || '';

            setMultiSelectValues('designation_select', emp.designation);

            const roleSelect = document.querySelector('select[name="role"]');
            const roleValue = emp.role || 'Editor';
            if (roleSelect) {
                if (![...roleSelect.options].some(o => o.value === roleValue)) {
                    const option = document.createElement('option');
                    option.value = roleValue;
                    option.textContent = roleValue;
                    roleSelect.appendChild(option);
                }
                roleSelect.value = roleValue;
            }
        }

        const editIdFromQuery = getQueryParam('edit');
        if (editIdFromQuery) {
            loadEmployeeForEdit(editIdFromQuery);
        }

        // Add file name display functionality
        const fileInputs = [
            { inputName: 'photo', displayId: 'photo-name' },
            { inputName: 'resume', displayId: 'resume-name' },
            { inputName: 'aadhaar_front', displayId: 'aadhaar_front-name' },
            { inputName: 'aadhaar_back', displayId: 'aadhaar_back-name' },
            { inputName: 'certificates', displayId: 'certificates-name' }
        ];

        fileInputs.forEach(({ inputName, displayId }) => {
            const input = document.querySelector(`input[name="${inputName}"]`);
            const display = document.getElementById(displayId);
            if (input && display) {
                input.addEventListener('change', () => {
                    if (input.files.length > 0) {
                        display.textContent = '📄 ' + input.files[0].name;
                        display.style.color = '#059669';
                    } else {
                        display.textContent = '';
                    }
                });
            }
        });

        // Also add for the certificates in Education section
        const certificatesEduInputs = document.querySelectorAll('input[name="certificates"]');
        if (certificatesEduInputs.length > 0) {
            certificatesEduInputs[0].addEventListener('change', () => {
                const display = document.getElementById('certificates-edu-name');
                if (display) {
                    if (certificatesEduInputs[0].files.length > 0) {
                        display.textContent = '📄 ' + certificatesEduInputs[0].files[0].name;
                        display.style.color = '#059669';
                    } else {
                        display.textContent = '';
                    }
                }
            });
        }

        document.getElementById('add-employee-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = document.getElementById('add-employee-form');
            const fd = new FormData(form);
            const isEdit = Boolean(editEmployeeId);
            const url = isEdit ? '/api/admin/edit-employee/' + encodeURIComponent(editEmployeeId) : '/api/admin/add-employee';
            const method = isEdit ? 'PUT' : 'POST';
            const res = await fetch(url, { method, body: fd });
            const data = await res.json();
            alert(data.message + (data.employee_code ? ' - ' + data.employee_code : ''));
            if (res.ok) {
                form.reset();
                window.location.href = isEdit ? '/admin/view-employees' : '/admin/dashboard';
            }
        });
    </script>
    <script src="/static/js/notification_badges.js"></script>
</body>

</html>
